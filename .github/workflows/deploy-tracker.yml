name: Deploy safety tracker to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Build tracker site
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL || secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY || secrets.SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail
          mkdir -p _site
          cp -R web_tracker/. _site/
          python3 - <<'PY'
          import html
          import os
          from pathlib import Path

          supabase_url = os.environ["SUPABASE_URL"].strip()
          anon_key = os.environ["SUPABASE_ANON_KEY"].strip()
          if not supabase_url.startswith("https://") or not anon_key:
              raise SystemExit("Set the public SUPABASE_URL and SUPABASE_ANON_KEY Actions variables.")

          tracker = Path("_site/track.html")
          content = tracker.read_text(encoding="utf-8")
          settings = {
              '<meta name="supabase-url" content="">':
                  f'<meta name="supabase-url" content="{html.escape(supabase_url, quote=True)}">',
              '<meta name="supabase-anon-key" content="">':
                  f'<meta name="supabase-anon-key" content="{html.escape(anon_key, quote=True)}">',
          }
          for placeholder, configured_tag in settings.items():
              if content.count(placeholder) != 1:
                  raise SystemExit(f"Expected exactly one tracker configuration placeholder: {placeholder}")
              content = content.replace(placeholder, configured_tag, 1)
          tracker.write_text(content, encoding="utf-8")
          PY

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
