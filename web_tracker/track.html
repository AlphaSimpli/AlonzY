<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="referrer" content="no-referrer">
    <meta name="supabase-url" content="">
    <meta name="supabase-anon-key" content="">
    <title>AlonzY — suivi de trajet</title>
    <link href="https://unpkg.com/maplibre-gl@5.6.1/dist/maplibre-gl.css" rel="stylesheet">
    <style>
      html, body { height: 100%; margin: 0; font: 16px system-ui, sans-serif; }
      #map { height: 100%; }
      #status { position: absolute; z-index: 1; top: 12px; left: 12px; right: 12px;
        padding: 12px 16px; border-radius: 10px; background: #fff; box-shadow: 0 2px 12px #0002; }
      #attribution { position: absolute; bottom: 8px; right: 8px; z-index: 1;
        background: #fff; padding: 3px 6px; font-size: 11px; }
    </style>
  </head>
  <body>
    <div id="status" role="status">Chargement du suivi…</div>
    <div id="map" aria-label="Carte de la position partagée"></div>
    <div id="attribution">© OpenStreetMap contributors</div>
    <script src="https://unpkg.com/maplibre-gl@5.6.1/dist/maplibre-gl.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
      // Deployment may inject window.ALONZY_CONFIG before this script or set
      // the two public Supabase meta tags above. Never inject a service key.
      const runtimeConfig = window.ALONZY_CONFIG ?? {};
      const metaContent = (name) =>
        document.querySelector(`meta[name="${name}"]`)?.content?.trim() ?? '';
      const SUPABASE_URL =
        runtimeConfig.SUPABASE_URL ?? metaContent('supabase-url');
      const SUPABASE_ANON_KEY =
        runtimeConfig.SUPABASE_ANON_KEY ?? metaContent('supabase-anon-key');
      const token = new URLSearchParams(window.location.search).get('token');
      const status = document.getElementById('status');
      let marker;
      let startMarker;
      let endMarker;
      let mapReady = false;
      let latestPosition;
      let latestRoute;
      let routeFitted = false;
      let routeAttempted = false;
      const map = new maplibregl.Map({
        container: 'map',
        style: {
          version: 8,
          sources: {
            osm: {
              type: 'raster',
              tiles: ['https://tile.openstreetmap.org/{z}/{x}/{y}.png'],
              tileSize: 256,
              attribution: '© OpenStreetMap contributors'
            }
          },
          layers: [{ id: 'osm', type: 'raster', source: 'osm' }]
        },
        center: [-73.5673, 45.5017],
        zoom: 10
      });
      map.addControl(new maplibregl.NavigationControl(), 'bottom-right');
      map.on('load', () => {
        mapReady = true;
        if (latestRoute) renderRoute(latestRoute);
        if (latestPosition) renderPosition(latestPosition);
      });

      function showStatus(message) {
        status.textContent = message;
      }

      function renderPosition(position) {
        if (!mapReady) return;
        const point = [Number(position.lng), Number(position.lat)];
        if (!marker) {
          marker = new maplibregl.Marker({ color: '#10B981' })
            .setLngLat(point)
            .addTo(map);
          if (!routeFitted) map.flyTo({ center: point, zoom: 14 });
        } else {
          marker.setLngLat(point);
        }
        const timestamp = new Date(position.recorded_at).toLocaleTimeString();
        showStatus(`Position mise à jour à ${timestamp}`);
      }

      function renderRoute(route) {
        if (!mapReady) return;
        latestRoute = route;
        if (!map.getSource('ride-route')) {
          map.addSource('ride-route', { type: 'geojson', data: route });
          map.addLayer({
            id: 'ride-route-outline',
            type: 'line',
            source: 'ride-route',
            layout: { 'line-cap': 'round', 'line-join': 'round' },
            paint: {
              'line-color': '#1E3A8A',
              'line-width': 7,
              'line-opacity': 0.45
            }
          });
          map.addLayer({
            id: 'ride-route-main',
            type: 'line',
            source: 'ride-route',
            layout: { 'line-cap': 'round', 'line-join': 'round' },
            paint: { 'line-color': '#3B82F6', 'line-width': 4.5 }
          });
        } else {
          map.getSource('ride-route').setData(route);
        }

        const coordinates = route.geometry.coordinates;
        if (coordinates.length >= 2 && !routeFitted) {
          const bounds = coordinates.reduce(
            (result, coordinate) => result.extend(coordinate),
            new maplibregl.LngLatBounds(coordinates[0], coordinates[0])
          );
          map.fitBounds(bounds, {
            padding: { top: 80, right: 56, bottom: 120, left: 56 },
            duration: 0
          });
          startMarker = new maplibregl.Marker({ color: '#10B981' })
            .setLngLat(coordinates[0])
            .setPopup(new maplibregl.Popup().setText('Départ'))
            .addTo(map);
          endMarker = new maplibregl.Marker({ color: '#EF4444' })
            .setLngLat(coordinates[coordinates.length - 1])
            .setPopup(new maplibregl.Popup().setText('Arrivée'))
            .addTo(map);
          routeFitted = true;
        }
      }

      async function loadRoadRoute(position) {
        const rawEndpoints = [
          position.origin_lng,
          position.origin_lat,
          position.destination_lng,
          position.destination_lat
        ];
        if (!rawEndpoints.every(
              (coordinate) =>
                typeof coordinate === 'number' && Number.isFinite(coordinate)
            )) {
          return;
        }
        const endpoints = [
          [position.origin_lng, position.origin_lat],
          [position.destination_lng, position.destination_lat]
        ];
        if (
            Math.abs(endpoints[0][0]) > 180 ||
            Math.abs(endpoints[0][1]) > 90 ||
            Math.abs(endpoints[1][0]) > 180 ||
            Math.abs(endpoints[1][1]) > 90) {
          return;
        }
        try {
          const routeUrl =
            'https://router.project-osrm.org/route/v1/driving/' +
            endpoints.map((point) => point.join(',')).join(';') +
            '?overview=full&geometries=geojson&steps=false';
          const response = await fetch(routeUrl);
          if (!response.ok) throw new Error(`OSRM HTTP ${response.status}`);
          const payload = await response.json();
          const coordinates = payload?.routes?.[0]?.geometry?.coordinates;
          if (payload?.code !== 'Ok' ||
              !Array.isArray(coordinates) ||
              coordinates.length < 2) {
            throw new Error('OSRM route geometry is unavailable');
          }
          renderRoute({
            type: 'Feature',
            geometry: { type: 'LineString', coordinates },
            properties: {}
          });
        } catch (error) {
          console.warn('Could not load public tracker road route:', error);
          renderRoute({
            type: 'Feature',
            geometry: { type: 'LineString', coordinates: endpoints },
            properties: {}
          });
        }
      }

      async function refreshPosition(client) {
        try {
          const { data, error } = await client.rpc('get_shared_position', {
            share_token: token
          });
          if (error) throw error;
          const position = Array.isArray(data) ? data[0] : data;
          if (!position ||
              !Number.isFinite(Number(position.lat)) ||
              !Number.isFinite(Number(position.lng))) {
            showStatus('Lien invalide ou expiré, ou trajet terminé. Demandez un nouveau lien au passager.');
            return;
          }
          latestPosition = {
            lat: Number(position.lat),
            lng: Number(position.lng),
            recorded_at: position.recorded_at
          };
          if (!routeAttempted) {
            routeAttempted = true;
            await loadRoadRoute(position);
          }
          renderPosition(latestPosition);
        } catch (error) {
          console.error('Safety tracker refresh failed:', error);
          showStatus('Le suivi est momentanément indisponible. Réessayez plus tard.');
        }
      }

      async function start() {
        if (!token || !/^[A-Za-z0-9_-]{43}$/.test(token)) {
          showStatus('Lien de suivi invalide ou incomplet.');
          return;
        }
        if (!SUPABASE_URL || !SUPABASE_ANON_KEY) {
          showStatus('Le suivi n’est pas configuré avec les paramètres publics Supabase.');
          return;
        }
        let client;
        try {
          client = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
            auth: { persistSession: false, autoRefreshToken: false, detectSessionInUrl: false }
          });
        } catch (error) {
          console.error('Safety tracker configuration failed:', error);
          showStatus('Impossible d’initialiser le suivi. Vérifiez la configuration.');
          return;
        }
        await refreshPosition(client);
        window.setInterval(() => refreshPosition(client), 12000);
      }

      start();
    </script>
  </body>
</html>
